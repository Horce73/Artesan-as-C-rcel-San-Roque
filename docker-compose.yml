services:
  postgres-db:
    image: postgres:16-alpine
    container_name: sanroque_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sanroque_db}
      POSTGRES_USER: ${POSTGRES_USER:-sanroque_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanroque_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanroque_user} -d ${POSTGRES_DB:-sanroque_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanroque_backend
    restart: always
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sanroque_db}
      POSTGRES_USER: ${POSTGRES_USER:-sanroque_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanroque_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-san_roque_artesanias_secret_key_2026_safe}
      UPLOADS_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sanroque_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
